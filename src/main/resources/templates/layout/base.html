<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title,contenido,claseBody)">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:replace="${title}">Configuracion de la vista</title>
        <link rel="stylesheet" th:href="@{/styles/styles.css}">
        <link rel="icon" type="image/png" th:href="@{/recursos/imgs/isotipo.png}">
    </head>

    <body th:class="${claseBody}">
    <header th:if="${claseBody != 'page-feed-admin' and claseBody != 'page-place'}">

        <!-- Admin: misma estructura que tenías en crear-lugar.html -->
        <nav class="navegation-desktop"
             th:if="${claseBody != null and #strings.startsWith(claseBody, 'page-admin')}">
            <a class="logo" th:href="@{/feed-admin}">
                <img th:src="@{/recursos/icons/isotipo.png}" alt="logo obregon dice">
            </a>
            <ul>
                <li><a th:href="@{/admin/crear-lugar}">Lugares</a></li>
                <li><a th:href="@{/admin/categorias}">Categorías</a></li>
                <li><a th:href="@{/admin/gestion-usuarios}">Usuarios</a></li>
                <li><a th:href="@{/admin/metricas}">Métricas</a></li>
                <li><a th:href="@{/feed-admin}">Inicio</a></li>
            </ul>
        </nav>

        <!-- Resto de páginas (login, registro, etc.): igual que antes -->
        <th:block th:unless="${claseBody != null and #strings.startsWith(claseBody, 'page-admin')}">
            <a class="logo">
                <img th:src="@{/recursos/icons/isotipo.png}" alt="logo obregon dice">
            </a>
            <img th:src="@{/recursos/icons/titulo.png}" alt="titulo obregon dice" class="titulo-app">
        </th:block>
    </header>


    <!-- Oculto en feed-admin para no encimarse al banner -->
    <nav th:if="${claseBody != 'page-feed-admin' and claseBody != 'page-place' and claseBody != 'page-admin-crear-lugar' and claseBody != 'page-admin-metricas'}">
        <th:block th:if="${session.admin_id != null}">
            <form th:action="@{/admin/logout}" method="post">
                <button type="submit">Cerrar sesión</button>
            </form>
        </th:block>
    </nav>


    <!-- Main -->
    <main class="container" th:replace="${contenido}">
        Contenido default.
    </main>

    <!-- Pie de página móvil -->
    <footer class="footer-mobile" th:if="${session.admin_id != null}">
        <nav class="navegation-mobile">
            <ul>
                <li><a th:href="@{/admin/crear-lugar}"><img th:src="@{/recursos/icons/marcador.png}" alt="Marcador"><p>Lugares</p></a></li>
                <li><a th:href="@{/admin/categorias}"><img th:src="@{/recursos/icons/categoria.png}" alt="Categorías"><p>Categorías</p></a></li>
                <li><a th:href="@{/admin/gestion-usuarios}"><img th:src="@{/recursos/icons/usuarios.png}" alt="Usuarios"><p>Usuarios</p></a></li>
                <li><a th:href="@{/admin/metricas}"><img th:src="@{/recursos/icons/metricas.png}" alt="Métricas"><p>Métricas</p></a></li>
                <li><a th:href="@{/feed-admin}"><img th:src="@{/recursos/icons/casita.png}" alt="Inicio"><p>Inicio</p></a></li>
            </ul>
        </nav>
    </footer>
</body>
</html>
