<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../recursos/imgs/isotipo.png">
    <title>Gestionar Categoría</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
<header>
    <nav class="navegation-desktop">
        <a class="logo">
            <img src="../recursos/icons/isotipo.png" alt="logo obregon dice">
        </a>
        <ul>
            <li><a href="crear-lugar.html">Lugares</a></li>
            <li><a href="gestionar-categoria.html">Categorías</a></li>
            <li><a href="gestion-usuarios.html">Usuarios</a></li>
            <li><a href="metricas.html">Métricas</a></li>
            <li><a href="index.html">Inicio</a></li>
        </ul>
    </nav>
</header>
<main>
    <form action="" class="form-gestionar-categoria">
        <h1>Gestionar categoría</h1>

        <div class="categoria">
            <div class="nombre-categoria">
                <h2>Restaurante</h2>
            </div>
            <div class="opciones-categoria">
                <div class="accion-editar">
                    <img src="../recursos/icons/lapiz.png" alt="Lápiz">
                    <p>Editar</p>
                </div>

                <div class="accion-eliminar">
                    <img src="../recursos/icons/boteBasura.png" alt="Bote de basura">
                    <p>Eliminar</p>
                </div>
            </div>
        </div>

        <div class="categoria">
            <div class="nombre-categoria">
                <h2>Café</h2>
            </div>
            <div class="opciones-categoria">
                <div class="accion-editar">
                    <img src="../recursos/icons/lapiz.png" alt="Lápiz">
                    <p>Editar</p>
                </div>

                <div class="accion-eliminar">
                    <img src="../recursos/icons/boteBasura.png" alt="Bote de basura">
                    <p>Eliminar</p>
                </div>
            </div>
        </div>

        <dialog id="modalEditarCategoria">
            <h2>Nuevo nombre</h2>

            <div class="form-group">
                <label for="nuevo-nombre-input">Introduce el nuevo nombre:</label>
                <input type="text" id="nuevo-nombre-input" placeholder="Escribe aquí..." autocomplete="off">
            </div>

            <div class="modal-acciones">
                <button type="button" id="boton-cancelar">Cancelar</button>
                <button type="button" id="boton-aceptar">Aceptar</button>
            </div>
        </dialog>

        <dialog id="modalEliminarCategoria">
            <h2>¿Eliminar categoría?</h2>
            <div class="modal-acciones">
                <button type="button" id="boton-cancelar-eliminar">Cancelar</button>
                <button type="button" id="boton-confirmar-eliminar">Eliminar</button>
            </div>
        </dialog>

        <dialog id="modalExito">
            <h2>Cambios realizados</h2>
            <div class="modal-acciones">
                <button type="button" id="boton-exito-aceptar">Aceptar</button>
            </div>
        </dialog>

        <button type="button" class="boton-crear-categoria" onclick="location.href='crear-categoria.html'">Crear categoría</button>
    </form>

    <script>
        const modalEditar = document.getElementById('modalEditarCategoria');
        const modalEliminar = document.getElementById('modalEliminarCategoria');
        const modalExito = document.getElementById('modalExito');
        const inputNombre = document.getElementById('nuevo-nombre-input');

        // Abrir modales según el botón pulsado
        document.addEventListener('click', (e) => {
            const editar = e.target.closest('.accion-editar');
            const eliminar = e.target.closest('.accion-eliminar');

            if (editar) {
                inputNombre.value = editar.closest('.categoria').querySelector('.nombre-categoria h2').textContent;
                modalEditar.showModal();
            } else if (eliminar) {
                modalEliminar.showModal();
            }
        });

        // Editar
        document.getElementById('boton-cancelar').addEventListener('click', () => modalEditar.close());

        document.getElementById('boton-aceptar').addEventListener('click', () => {
            // aquí va la lógica de editar la categoría
            modalEditar.close();
            modalExito.showModal();
        });

        // Eliminar
        document.getElementById('boton-cancelar-eliminar').addEventListener('click', () => modalEliminar.close());

        document.getElementById('boton-confirmar-eliminar').addEventListener('click', () => {
            //aquí va la lógica de eliminar la categoría
            modalEliminar.close();
            modalExito.showModal();
        });

        // Éxito
        document.getElementById('boton-exito-aceptar').addEventListener('click', () => modalExito.close());
    </script>
</main>

<footer class="footer-mobile">
    <nav class="navegation-mobile">
        <ul>
            <li><a href="crear-lugar.html"><img src="../recursos/icons/marcador.png" alt="Marcador">
                <p>Lugares</p></a></li>
            <li><a href="gestionar-categoria.html"><img src="../recursos/icons/categoria.png" alt="Marcador">
                <p>Categorías</p></a></li>
            <li><a href="gestion-usuarios.html"><img src="../recursos/icons/usuarios.png" alt="Marcador">
                <p>Usuarios</p></a></li>
            <li><a href="metricas.html"><img src="../recursos/icons/metricas.png" alt="Marcador">
                <p>Métricas</p></a></li>
            <li><a href="index.html"><img src="../recursos/icons/casita.png" alt="Marcador">
                <p>Inicio</p></a></li>
        </ul>
    </nav>
</footer>
</body>
</html>
