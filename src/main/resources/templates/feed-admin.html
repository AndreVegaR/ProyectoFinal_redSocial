<th:block th:replace="~{layout/base :: layout(~{::title}, ~{::main}, 'page-feed-admin')}">

  <title>Inicio admin - Obregón Dice</title>

  <main>
    <header>
      <!-- desktop -->
      <div class="version-desktop">
        <img th:src="@{/recursos/imgs/imgFeedDesktop.png}" class="fondo-img-desktop" alt="Fondo">
        <div class="contenido-header-desktop">
          <div class="header-top-desktop">
            <a class="logo-desktop" th:href="@{/admin/feed}">
              <img th:src="@{/recursos/icons/titulo.png}" alt="logo obregon dice">
            </a>

            <form th:action="@{/admin/feed}" method="get" class="buscador-desktop">
              <input type="text" name="busqueda" th:value="${param.busqueda}" placeholder="Busca cosas de tu interés">
              <button type="submit" class="btn-lupa-desktop">
                <img th:src="@{/recursos/icons/lupa.png}" alt="buscar">
              </button>
            </form>

            <nav class="navegation-desktop">
              <ul>
                <li><a th:href="@{/admin/lugares}">Lugares</a></li>
                <li><a th:href="@{/admin/categorias}">Categorías</a></li>
                <li><a th:href="@{/admin/usuarios}">Usuarios</a></li>
                <li><a th:href="@{/admin/metricas}">Métricas</a></li>
                <li><a th:href="@{/admin/feed}">Inicio</a></li>
              </ul>
            </nav>
          </div>

          <div class="pestanas-desktop">
            <a th:href="@{/admin/feed(tipo='lugares')}" class="activa">Lugares</a>
            <a th:href="@{/admin/feed(tipo='usuarios')}">Usuarios</a>
          </div>

          <div class="filtros-desktop">
            <div class="categorias-desktop">
              <a th:each="cat : ${categorias}"
                 th:href="@{/admin/feed(categoriaId=${cat.id})}"
                 th:text="${cat.nombre}"
                 class="dropdown">Gastronomía</a>
            </div>

            <div class="calificacion-desktop">
              <span>Calificación</span>
              <div class="fuegos-desktop">
                <a th:each="num : ${#numbers.sequence(1, 5)}"
                   th:href="@{/admin/feed(calificacion=${num})}">
                  <img th:src="@{/recursos/icons/fueguito.png}" th:alt="'fuego_' + ${num}">
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- movil -->
      <div class="version-movil">
        <a class="logo-movil" th:href="@{/admin/feed}">
          <img th:src="@{/recursos/icons/isotipo.png}" alt="logo obregon dice">
        </a>

        <form th:action="@{/admin/feed}" method="get" class="nav-movil">
          <div class="buscador">
            <button type="submit" class="lupa">
              <img th:src="@{/recursos/icons/lupa.png}" alt="lupa buscadora">
            </button>
            <input type="text" name="busqueda" th:value="${param.busqueda}" id="barra-busqueda" placeholder="Busca tu lugar de preferencia">
          </div>

          <div class="filtros">
            <div class="categorias">
              <input type="checkbox" id="menu-desplegable" class="desplegar">
              <label for="menu-desplegable" class="boton-desplegado">Categorías ▼</label>

              <div class="opciones">
                <label th:each="cat : ${categorias}">
                  <input type="checkbox" name="categoriaIds" th:value="${cat.id}">
                  <span th:text="${cat.nombre}">Gastronomía</span>
                </label>
              </div>
            </div>

            <div class="calificacion">
              <img th:each="num : ${#numbers.sequence(1, 5)}"
                   th:src="@{/recursos/icons/fueguito.png}" th:alt="'fuego_' + ${num}">
            </div>
          </div>

          <div class="botones">
            <button type="submit" name="tipo" value="lugares" id="boton-filtro-lugar">Lugares</button>
            <button type="submit" name="tipo" value="usuarios" id="boton-filtro-usuario">Usuarios</button>
          </div>
        </form>
      </div>
    </header>

    <!-- tarjetas de lugares -->
    <section>
      <a th:href="@{/admin/lugares/{id}(id=${lugar.id})}" class="enlace-tarjeta" th:each="lugar : ${lugares}">
        <article class="tarjeta">
          <h3 th:text="${lugar.nombre}">Mc Donalds's</h3>

          <div class="calificacion-tarjeta">
            <img th:each="i : ${#numbers.sequence(1, 5)}"
                 th:src="${i <= (lugar.calificacionPromedio ?:0)} ? @{/recursos/icons/fueguito.png} : @{/recursos/icons/fuego-apagado.png}"
                 th:alt="'fuego_' + ${i}">

            <h3 class="numero-resenas" th:text="${#lists.size(lugar.resenas)}">15</h3>
          </div>

          <img th:src="@{'/recursos/imgs/' + ${lugar.imagenUrl}}" th:alt="${lugar.nombre}">
        </article>
      </a>

      <p th:if="${#lists.isEmpty(lugares)}">No se encontraron lugares para mostrar.</p>
    </section>
  </main>
</th:block>
