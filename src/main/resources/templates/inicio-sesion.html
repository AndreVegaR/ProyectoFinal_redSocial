<th:block th:replace="~{layout/base :: layout(~{::title}, ~{::main}, 'page-form')}">
    <title>Inicio Sesión - Obregón Dice</title>

    <main>
        <form th:action="@{/inicio-sesion}" method="post">

            <legend>Iniciar Sesión</legend>

            <p th:if="${param.error}" style="color: red;">
                Credencial inválida.
            </p>

            <p th:if="${param.logout}">
                Cerraste sesión.
            </p>

            <div>
                <label for="txt-correo">Correo Electrónico</label>
                <input type="email" name="correo" id="txt-correo" placeholder="lapiz@mail.com">
            </div>

            <div>
                <label for="txt-contrasenia">Contraseña</label>
                <input type="password" name="contrasenia" id="txt-contrasenia" placeholder="*********">
            </div>

            <div>
                <button type="submit" class="form-button">Ingresar</button>
                <p>¿No tienes cuenta? <a th:href="@{/registro}"><span>Regístrate</span></a></p>
                <a th:href="@{/feed-admin}"><p>Temporal: ingresar como administrador</p></a>
            </div>
        </form>

        <!-- imagen escritorio -->
        <img th:src="@{/recursos/imgs/yaqui.png}" alt="Figura yaqui" class="img-yaqui">
    </main>

</th:block>
