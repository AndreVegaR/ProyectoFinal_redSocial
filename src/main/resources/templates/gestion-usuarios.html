<th:block th:replace="~{layout/base :: layout(~{::title}, ~{::main}, 'page-admin-usuarios')}">

    <title>Gestionar Usuarios</title>

    <main>
        <form th:action="@{/admin/usuarios}" method="get">
            <div id="gestion-usuarios">
                <svg class="lupa-busqueda" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <circle cx="10" cy="10" r="6.5"/>
                    <line x1="15" y1="15" x2="21" y2="21"/>
                </svg>
                <input type="text" name="nombreUsuario" id="txt-usuario" th:value="${param.nombreUsuario}" placeholder="Buscar usuario">
            </div>
            <div id="seccion-usuarios">
                <div class="tarjeta-usuario" th:each="usuario : ${usuarios}">
                    <img th:src="${usuario.fotoPerfil != null} ? @{'/recursos/imgs/' + ${usuario.fotoPerfil}} : @{/recursos/imgs/perrolengua.png}" alt="Foto-perfil">
                    <p th:text="${usuario.nickname}">gamota</p>
                    <button type="button" th:onclick="|window.location.href='@{/admin/usuarios/{id}(id=${usuario.id})}'|">Gestionar</button>
                </div>
            </div>
        </form>
    </main>

</th:block>
