<th:block th:replace="~{layout/base :: layout(~{::encabezado}, ~{::main}, 'page-admin-metricas')}">

    <th:block th:fragment="encabezado">
        <title>Métricas - Obregón Dice</title>
    </th:block>

    <main class="metricas">
        <!-- PARTE PARA MOVIL -->
        <div class="metricas-movil">
            <!-- Parte superior -->
            <section class="tituloMetricas">
                <h1>Métricas</h1>
                <div class="comboboxMetricas">
                    <select class="combobox" id="opciones" name="opciones">
                        <option value="opcion1">Últimos 30 días</option>
                        <option value="opcion2">Últimos 60 días</option>
                        <option value="opcion3">Últimos 90 días</option>
                    </select>
                </div>
            </section>

            <!-- Cuadritos con información resumida clave sobre las métricas -->
            <section class="cantidadMetricas">
                <div class="cuadritoMetricas">
                    <legend>Reseñas</legend>
                    <h3>15</h3>
                </div>

                <div class="cuadritoMetricas">
                    <legend>Promedio</legend>
                    <h3>4 (300 reseñas)</h3>
                </div>
            </section>

            <!-- Lugares más reseñados -->
            <section class="masReseniados">
                <h1>Más reseñados</h1>

                <!-- Lugar reseñado -->
                <article class="tarjeta">
                    <h3>Mc Donalds's</h3>
                    <div class="calificacion-tarjeta">
                        <img src="../recursos/icons/fueguito.png" th:src="@{/recursos/icons/fueguito.png}" alt="fuego_1">
                        <img src="../recursos/icons/fueguito.png" th:src="@{/recursos/icons/fueguito.png}" alt="fuego_2">
                        <img src="../recursos/icons/fueguito.png" th:src="@{/recursos/icons/fueguito.png}" alt="fuego_3">
                        <img src="../recursos/icons/fuego-apagado.png" th:src="@{/recursos/icons/fuego-apagado.png}" alt="fuego_4">
                        <img src="../recursos/icons/fuego-apagado.png" th:src="@{/recursos/icons/fuego-apagado.png}" alt="fuego_5">
                        <h3 class="numero-resenas">15</h3>
                    </div>
                    <img src="../recursos/imgs/mcdonals.png" th:src="@{/recursos/imgs/mcdonals.png}">
                </article>
            </section>

            <!-- Más activos -->
            <section class="masActivos">
                <h1>Más activos</h1>

                <!-- Un solo article que se repite por cada usuario -->
                <article class="tarjetaAndre tarjetaUsuario" th:each="usuario : ${usuarios}">
                    <img class="pfp"
                         th:src="${usuario.fotoPerfil != null and !#strings.isEmpty(usuario.fotoPerfil)} ? @{${usuario.fotoPerfil}} : @{/recursos/imgs/mcdonals.png}"
                         th:alt="${usuario.nickname}">

                    <h3 th:text="'@' + ${usuario.nickname} + ' (' + ${#lists.size(usuario.resenas)} + ')'">
                        @usuario (0)
                    </h3>

                    <form th:if="${usuario.estado.name() == 'ACTIVO'}"
                          th:action="@{/admin/metricas/{id}/deshabilitar(id=${usuario.id})}"
                          method="post" style="display: contents;">
                        <button type="submit">Deshabilitar</button>
                    </form>

                    <form th:if="${usuario.estado.name() == 'INACTIVO'}"
                          th:action="@{/admin/metricas/{id}/habilitar(id=${usuario.id})}"
                          method="post" style="display: contents;">
                        <button type="submit">Habilitar</button>
                    </form>
                </article>
            </section>
        </div>

        <!-- PARTE PARA ESCRITORIO -->
        <div class="metricas-escritorio">
            <!-- Parte superior de las métricas -->
            <section class="tituloMetricasEscritorio">
                <h1>Métricas</h1>

                <div class="filtrosEscritorio">
                    <!-- Buscador manteniendo la estructura original para no romper el CSS -->
                    <div class="buscadorEscritorio">
                        <form th:action="@{/admin/metricas}" method="get" style="display: contents;">
                            <input type="text" id="buscador-escritorio" name="buscador"
                                   th:value="${busquedaActual}" placeholder="Buscar">
                            <button class="botonLupaEscritorio" type="submit">
                                <img src="../recursos/icons/lupa.png" th:src="@{/recursos/icons/lupa.png}" alt="Buscar">
                            </button>
                        </form>
                    </div>

                    <!-- Combobox para días -->
                    <select class="combobox comboboxEscritorio" id="opciones-escritorio" name="opciones">
                        <option value="opcion1">Últimos 30 días</option>
                        <option value="opcion2">Últimos 60 días</option>
                        <option value="opcion3">Últimos 90 días</option>
                    </select>

                    <!-- Combobox para categorías -->
                    <select class="combobox comboboxEscritorio" id="categorias-escritorio" name="opciones">
                        <option value="">Categoría</option>
                        <option value="opcion1">Restaurantes</option>
                        <option value="opcion2">Recreación</option>
                        <option value="opcion3">Instituciones</option>
                    </select>

                    <!-- Filtro por calificación -->
                    <div class="calificacionFiltroEscritorio">
                        <h3>Calificación</h3>
                        <div class="fuegosFiltroEscritorio">
                            <img src="../recursos/icons/fueguito.png" th:src="@{/recursos/icons/fueguito.png}" alt="fuego_1">
                            <img src="../recursos/icons/fueguito.png" th:src="@{/recursos/icons/fueguito.png}" alt="fuego_2">
                            <img src="../recursos/icons/fueguito.png" th:src="@{/recursos/icons/fueguito.png}" alt="fuego_3">
                            <img src="../recursos/icons/fueguito.png" th:src="@{/recursos/icons/fueguito.png}" alt="fuego_4">
                            <img src="../recursos/icons/fueguito.png" th:src="@{/recursos/icons/fueguito.png}" alt="fuego_5">
                        </div>
                    </div>

                    <!-- Combobox según reseñas -->
                    <select class="combobox comboboxEscritorio" id="reseniados-escritorio" name="opciones">
                        <option value="opcion1">Más reseñados</option>
                        <option value="opcion2">Menos reseñados</option>
                    </select>
                </div>
            </section>

            <!-- Contenido: lugares y usuarios -->
            <div class="contenidoEscritorio">
                <!-- Lugares más reseñados -->
                <section class="panelEscritorio masReseniadosEscritorio">
                    <h2>Más reseñados</h2>

                    <!-- Lugar reseñado -->
                    <article class="lugarEscritorio">
                        <h3>Dogos el chapo</h3>
                        <div class="datosLugarEscritorio">
                            <img class="fotoLugarEscritorio" src="../recursos/imgs/dogos.png" th:src="@{/recursos/imgs/dogos.png}" alt="Dogos el chapo">
                            <div class="cuadroDatoEscritorio">
                                <h4>Reseñas</h4>
                                <p>250</p>
                            </div>
                            <div class="cuadroDatoEscritorio">
                                <h4>Promedio</h4>
                                <div class="fuegosEscritorio">
                                    <img src="../recursos/icons/fueguito.png" th:src="@{/recursos/icons/fueguito.png}" alt="fuego_1">
                                    <img src="../recursos/icons/fueguito.png" th:src="@{/recursos/icons/fueguito.png}" alt="fuego_2">
                                    <img src="../recursos/icons/fueguito.png" th:src="@{/recursos/icons/fueguito.png}" alt="fuego_3">
                                    <img src="../recursos/icons/fueguito.png" th:src="@{/recursos/icons/fueguito.png}" alt="fuego_4">
                                    <img src="../recursos/icons/fuego-apagado.png" th:src="@{/recursos/icons/fuego-apagado.png}" alt="fuego_5">
                                </div>
                            </div>
                        </div>
                    </article>

                    <!-- Lugar reseñado -->
                    <article class="lugarEscritorio">
                        <h3>Mc Donnald's</h3>
                        <div class="datosLugarEscritorio">
                            <img class="fotoLugarEscritorio" src="../recursos/imgs/mcdonals.png" th:src="@{/recursos/imgs/mcdonals.png}" alt="Mc Donnald's">
                            <div class="cuadroDatoEscritorio">
                                <h4>Reseñas</h4>
                                <p>130</p>
                            </div>
                            <div class="cuadroDatoEscritorio">
                                <h4>Promedio</h4>
                                <div class="fuegosEscritorio">
                                    <img src="../recursos/icons/fueguito.png" th:src="@{/recursos/icons/fueguito.png}" alt="fuego_1">
                                    <img src="../recursos/icons/fueguito.png" th:src="@{/recursos/icons/fueguito.png}" alt="fuego_2">
                                    <img src="../recursos/icons/fueguito.png" th:src="@{/recursos/icons/fueguito.png}" alt="fuego_3">
                                    <img src="../recursos/icons/fuego-apagado.png" th:src="@{/recursos/icons/fuego-apagado.png}" alt="fuego_4">
                                    <img src="../recursos/icons/fuego-apagado.png" th:src="@{/recursos/icons/fuego-apagado.png}" alt="fuego_5">
                                </div>
                            </div>
                        </div>
                    </article>
                </section>

                <!-- Usuarios más activos -->
                <section class="panelEscritorio masActivosEscritorio">
                    <h2>Más activos</h2>
                    <div class="listaUsuariosEscritorio">

                        <article class="usuarioEscritorio" th:each="usuario : ${usuarios}">

                            <!-- Usa fotoPerfil (con imagen de respaldo que sí existe en /recursos/imgs/) -->
                            <img class="fotoUsuarioEscritorio"
                                 th:src="${usuario.fotoPerfil != null and !#strings.isEmpty(usuario.fotoPerfil)} ? @{${usuario.fotoPerfil}} : @{/recursos/imgs/mcdonals.png}"
                                 th:alt="${usuario.nickname}">

                            <!-- Muestra @nickname y el total de reseñas -->
                            <h3 th:text="'@' + ${usuario.nickname} + ' (' + ${#lists.size(usuario.resenas)} + ')'">
                                @usuario (0)
                            </h3>

                            <!-- Botón para deshabilitar -->
                            <form th:if="${usuario.estado.name() == 'ACTIVO'}"
                                  th:action="@{/admin/metricas/{id}/deshabilitar(id=${usuario.id})}"
                                  method="post" style="display: contents;">
                                <button type="submit" class="botonGestionarEscritorio">Deshabilitar</button>
                            </form>

                            <!-- Botón para habilitar -->
                            <form th:if="${usuario.estado.name() == 'INACTIVO'}"
                                  th:action="@{/admin/metricas/{id}/habilitar(id=${usuario.id})}"
                                  method="post" style="display: contents;">
                                <button type="submit" class="botonGestionarEscritorio">Habilitar</button>
                            </form>

                        </article>

                    </div>
                </section>
            </div>
        </div>

    </main>
</th:block>
